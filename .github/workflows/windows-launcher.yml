name: Windows Claude launcher smoke test
on:
  workflow_dispatch:
  push:
    branches: [fix/windows-claude-launcher-20261111]
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Exercise the packaged Claude launcher against local fixtures
        env:
          WILBER_TEST_MARKETPLACE: .
        run: node --test .github/tests/windows-launcher.test.mjs
